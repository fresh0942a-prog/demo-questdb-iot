services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    ports:
      - "9000:9000"   # Consola web + ILP/HTTP + REST
      - "8812:8812"   # Protocolo PostgreSQL (pgwire)
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/exec?query=select%201 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sensores.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      questdb:
        condition: service_healthy

  simulador:
    build: ./simulador
    container_name: simulador
    environment:
      QDB_HOST: questdb
      QDB_HTTP_PORT: "9000"
      INTERVALO_SEG: "1"
    depends_on:
      questdb:
        condition: service_healthy

volumes:
  questdb-data:
  grafana-data:
